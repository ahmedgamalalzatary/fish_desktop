# Every push and pull request is checked once per shop, so a shared change can't break a shop unseen.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shops:
    name: shops and formatting
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: list
        run: echo "list=$(node scripts/shops.ts list)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run format:check

  check:
    name: check (${{ matrix.shop }})
    needs: shops
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shop: ${{ fromJSON(needs.shops.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.shop }}
      - run: npm ci
      - run: npm run check ${{ matrix.shop }}
