[package]
name = "pos"
version = "0.0.0"
description = "نظام نقاط بيع"
authors = ["Ahmed"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Exactly one shop per build: `--features fish` or `--features mobile`. See src/shops/.
[features]
fish = []
mobile = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Must match the versions used by wry, so PrintToPdf works on the same COM objects.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
